apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: roboshop
spec:
  selector:
    matchLabels:
      project: roboshop
      component: mysql
      tier: db

  serviceName: "mysql-headless"
  replicas: 2

  template:
    metadata:
      labels:
        project: roboshop
        component: mysql
        tier: db

    spec:
      containers:
      - name: mysql
        image: joindevops/mysql:v1

        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql
              key: MYSQL_ROOT_PASSWORD

        volumeMounts:
        - name: mysql
          mountPath: /data/db

        - name: mysql-config
          mountPath: /etc/mysql/conf.d/my.cnf
          subPath: my.cnf

      volumes:
      - name: mysql-config
        configMap:
          name: mysql

  volumeClaimTemplates:
  - metadata:
      name: mysql
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: roboshop-ebs
      resources:
        requests:
          storage: 1Gi