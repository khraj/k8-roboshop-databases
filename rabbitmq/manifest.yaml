# service, headless service, statefulset, pvc

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    project: roboshop
    environment: dev
    component: rabbitmq
    tier: db
spec:
  selector:
    project: roboshop
    environment: dev
    component: rabbitmq
    tier: db
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
    
---

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless-service
  labels:
    project: roboshop
    environment: dev
    component: rabbitmq
    tier: db
spec:
  clusteerIP: None
  selector:
    project: roboshop
    environment: dev
    component: rabbitmq
    tier: db
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: roboshop 
spec:
  selector:
    matchLabels:
      project: roboshop
      environment: dev
      component: rabbitmq
      tier: db
  serviceName: "rabbitmq-headless-service" # this should be headless service name
  replicas: 2
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        component: rabbitmq
        tier: db
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3
        volumeMounts:
        - name: rabbitmq
          mountPath: /var/lib/rabbitmq
    # PVC 
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi