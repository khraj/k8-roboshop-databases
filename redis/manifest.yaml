# service, headless service, statefulset, pvc

apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    project: roboshop
    environment: dev
    component: redis
    tier: db
spec:
  selector:
    project: roboshop
    environment: dev
    component: redis
    tier: db
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
    
---

apiVersion: v1
kind: Service
metadata:
  name: redis-headless-service
  labels:
    project: roboshop
    environment: dev
    component: redis
    tier: db
spec:
  clusteerIP: None
  selector:
    project: roboshop
    environment: dev
    component: redis
    tier: db
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: roboshop 
spec:
  selector:
    matchLabels:
      project: roboshop
      environment: dev
      component: redis
      tier: db
  serviceName: "redis-headless-service" # this should be headless service name
  replicas: 2
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        component: redis
        tier: db
    spec:
      containers:
      - name: redis
        image: redis:7.0
        volumeMounts:
        - name: redis
          mountPath: /data
        env:
        - name: RABBITMQ_DEFAUT_USER
          value: roboshop
        - name: RABBITMQ_DEFAULT_PASS
          value: roboshop123
    # PVC 
  volumeClaimTemplates:
  - metadata:
      name: redis
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi